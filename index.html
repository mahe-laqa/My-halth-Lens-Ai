<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyHealthLens AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Custom "Serene Professional" Palette
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7', 
                700: '#0369a1', // Main Brand Color (Rich Blue)
                800: '#075985',
                900: '#0c4a6e',
              },
              brand: {
                50: '#f0fdfa', // Minty White
                100: '#ccfbf1', // Soft Sage
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf', // Charming Teal
                500: '#14b8a6',
                600: '#0d9488', // Deep Teal (Primary Action)
                700: '#0f766e', // Premium Dark Teal (Headers)
                800: '#115e59',
                900: '#134e4a',
              },
              accent: {
                light: '#fde68a', // Soft Gold
                DEFAULT: '#f59e0b', // Rich Gold
                dark: '#b45309',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              urdu: ['"Noto Nastaliq Urdu"', 'serif'],
              arabic: ['"Noto Sans Arabic"', 'sans-serif'],
              hindi: ['"Noto Sans Devanagari"', 'sans-serif'],
              chinese: ['"Noto Sans SC"', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'slide-in': 'slideIn 0.3s ease-out forwards',
            },
            keyframes: {
              slideIn: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* Language Specific Font Classes */
      .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.8; }
      .font-arabic { font-family: 'Noto Sans Arabic', sans-serif; }
      .font-hindi { font-family: 'Noto Sans Devanagari', sans-serif; }
      .font-chinese { font-family: 'Noto Sans SC', sans-serif; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0"
  }
}
</script>
</head>
