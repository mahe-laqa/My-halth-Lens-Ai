<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Premium Soft Background Gradient: White to Very Pale Turquoise */
        background: linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%);
        min-height: 100vh;
      }
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* Language Specific Font Classes */
      .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.8; }
      .font-arabic { font-family: 'Noto Sans Arabic', sans-serif; }
      .font-hindi { font-family: 'Noto Sans Devanagari', sans-serif; }
      .font-chinese { font-family: 'Noto Sans SC', sans-serif; }

      /* Print Styles for Exporting PDF */
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: white !important;
          color: black;
        }
        .print-break-inside-avoid {
          break-inside: avoid;
        }
        /* Ensure images print fully */
        img {
          max-width: 100% !important;
          height: auto !important;
        }
        /* Hide scrollbars in print */
        ::-webkit-scrollbar {
          display: none;
        }
      }

    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
